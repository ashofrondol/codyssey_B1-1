<svg xmlns="http://www.w3.org/2000/svg" width="880" height="568" viewBox="0 0 880 568" role="img" aria-labelledby="title desc">
<title id="title">새 로그 파일이 생길 때 — default ACL 이 없을 때와 있을 때</title>
<desc id="desc">agent-admin 이 cron 에서 umask 022 로 monitor.log 를 새로 만든다. 폴더에 default ACL 이 없으면 새 파일은 -rw-r--r-- agent-admin agent-admin 이라 agent-dev 는 기타 칸 r-- 로 쓰지 못한다. default ACL(default:group:agent-core:rwx)이 있으면 새 파일에 group:agent-core 항목이 자동으로 붙어(-rw-rw----+, mask::rw-) agent-dev 가 읽고 쓸 수 있고, agent-test 는 other --- 로 거부된다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="568"/>
<rect class="box" x="340" y="16" width="200" height="40" rx="10"/>
<text x="440" y="41" text-anchor="middle" class="tb">agent-admin (cron)</text>
<text x="556" y="34" class="mono c-blue">echo ... &gt;&gt; monitor.log</text>
<text x="556" y="52" class="ts">새 파일을 만든다 · umask 022</text>
<path class="ln ln-blue" d="M440,56 L440,72 L228,72 L228,88" marker-end="url(#arrow-blue)"/>
<path class="ln ln-blue" d="M440,72 L652,72 L652,88" marker-end="url(#arrow-blue)"/>
<rect class="zone" x="24" y="92" width="400" height="380" rx="12"/>
<rect class="zone" x="456" y="92" width="400" height="380" rx="12"/>
<text x="40" y="116" class="tb">default ACL 없음</text>
<text x="40" y="136" class="ts">폴더 권한 770 만</text>
<rect class="purple" x="40" y="148" width="368" height="48" rx="10"/>
<text x="54" y="168" class="mono c-purple tb">drwxrwx---  root agent-core</text>
<text x="54" y="188" class="mono">/var/log/agent-app</text>
<line class="ln" x1="228" y1="196" x2="228" y2="260" marker-end="url(#arrow)"/>
<text x="240" y="234" class="ts">새 파일</text>
<rect class="purple" x="40" y="264" width="368" height="48" rx="10"/>
<text x="54" y="284" class="mono c-purple tb">-rw-r--r--  agent-admin agent-admin</text>
<text x="54" y="304" class="mono">monitor.log</text>
<line class="ln ln-red" x1="228" y1="312" x2="228" y2="388" marker-end="url(#arrow-red)"/>
<rect class="red" x="40" y="392" width="368" height="36" rx="10"/>
<text x="228" y="415" text-anchor="middle" class="c-red tb">agent-dev: 기타 칸 r-- → 쓰기 불가</text>
<text x="472" y="116" class="tb">default ACL 있음</text>
<text x="472" y="136" class="mono c-muted">setfacl -dm g:agent-core:rwx</text>
<rect class="purple" x="472" y="148" width="368" height="92" rx="10"/>
<text x="486" y="168" class="mono c-purple tb">drwxrwx---+ root agent-core</text>
<text x="486" y="188" class="mono">default:group:agent-core:rwx</text>
<text x="486" y="207" class="mono">default:mask::rwx</text>
<text x="486" y="226" class="mono">default:other::---</text>
<line class="ln" x1="652" y1="240" x2="652" y2="260" marker-end="url(#arrow)"/>
<text x="664" y="255" class="ts">새 파일 (물려받음)</text>
<rect class="yellow" x="472" y="264" width="368" height="112" rx="10"/>
<text x="486" y="284" class="mono tb">-rw-rw----+ agent-admin agent-admin</text>
<text x="486" y="304" class="mono">monitor.log</text>
<text x="486" y="327" class="mono">group:agent-core:rwx  #effective:rw-</text>
<text x="486" y="346" class="mono">mask::rw-</text>
<text x="486" y="365" class="mono">other::---</text>
<line class="ln ln-green" x1="652" y1="376" x2="652" y2="388" marker-end="url(#arrow-green)"/>
<rect class="green" x="472" y="392" width="368" height="36" rx="10"/>
<text x="652" y="415" text-anchor="middle" class="c-green tb">agent-dev: agent-core 항목 → 읽기·쓰기</text>
<rect class="red" x="472" y="436" width="368" height="28" rx="8"/>
<text x="652" y="455" text-anchor="middle" class="ts c-red">agent-test: other --- → 거부</text>
<text x="24" y="500" class="ts tb">파일의 소유 그룹은 그대로 agent-admin — 권한은 ACL 항목(group:agent-core)이 준다</text>
<text x="24" y="520" class="ts">default ACL 이 있으면 umask 는 무시된다 (그래서 그룹 칸이 r-- 가 아니라 rw-) · mask = 기본 그룹 칸과 추가 명단의 상한선</text>
<text x="24" y="540" class="ts">실측: 임시 폴더에서 계정 coder·그룹 docker 로 같은 실험 → 같은 결과 (-rw-r--r-- vs -rw-rw----+, mask::rw-)</text>
</svg>
