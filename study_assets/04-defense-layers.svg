<svg xmlns="http://www.w3.org/2000/svg" width="880" height="488" viewBox="0 0 880 488" role="img" aria-labelledby="title desc">
<title id="title">외부 접속이 통과해야 하는 세 겹</title>
<desc id="desc">세 가지 접속 시도가 방화벽(UFW), sshd 포트 설정(Port 20022), 로그인 정책(PermitRootLogin no)을 차례로 지나간다. 22번을 두드리는 봇은 1겹 방화벽에서, 20022로 root 로그인을 시도하는 공격자는 3겹 로그인 정책에서 멈춘다. 운영자는 일반 계정으로 세 겹을 모두 통과한 뒤 sudo로 다시 인증하고, 그 기록이 /var/log/auth.log에 남는다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="488"/>
<text class="th" x="24" y="34">외부 접속이 통과해야 하는 세 겹</text>
<text class="ts" x="24" y="56">왼쪽 → 오른쪽으로 읽는다 · 빨간 점선 = 공격 시도 · 파란 실선 = 정상 접속 · ✕ = 막힌 곳</text>

<!-- 세 겹 (세로 영역) -->
<rect class="zone" x="190" y="72" width="156" height="256" rx="12"/>
<text class="th" x="268" y="98" text-anchor="middle">1겹 방화벽 (UFW)</text>
<text class="ts" x="268" y="120" text-anchor="middle">기본 거부</text>
<text class="ts" x="268" y="140" text-anchor="middle">20022/15034 만 허용</text>

<rect class="zone" x="356" y="72" width="156" height="256" rx="12"/>
<text class="th" x="434" y="98" text-anchor="middle">2겹 sshd</text>
<text class="mono" x="434" y="120" text-anchor="middle">Port 20022</text>
<text class="ts" x="434" y="140" text-anchor="middle">SSH 문 번호를 옮김</text>

<rect class="zone" x="522" y="72" width="156" height="256" rx="12"/>
<text class="th" x="600" y="98" text-anchor="middle">3겹 로그인 정책</text>
<text class="mono" x="600" y="120" text-anchor="middle">PermitRootLogin no</text>
<text class="ts" x="600" y="140" text-anchor="middle">root 계정은 거부</text>

<!-- 행 A: 봇 -->
<rect class="box" x="24" y="150" width="150" height="52" rx="10"/>
<text class="tb" x="99" y="172" text-anchor="middle">봇 (자동 프로그램)</text>
<text class="ts" x="99" y="192" text-anchor="middle">22번에 무차별 대입</text>
<line class="ln ln-red dash" x1="174" y1="176" x2="202" y2="176"/>
<line class="ln ln-red" x1="204" y1="170" x2="216" y2="182"/>
<line class="ln ln-red" x1="216" y1="170" x2="204" y2="182"/>
<text class="ts c-red" x="226" y="172">22/tcp 규칙 없음</text>
<text class="ts c-red" x="226" y="190">→ 차단</text>

<!-- 행 B: 공격자 root -->
<rect class="box" x="24" y="210" width="150" height="52" rx="10"/>
<text class="tb" x="99" y="232" text-anchor="middle">공격자</text>
<text class="ts" x="99" y="252" text-anchor="middle">root 로 20022 접속</text>
<line class="ln ln-red dash" x1="174" y1="236" x2="530" y2="236"/>
<line class="ln ln-red" x1="532" y1="230" x2="544" y2="242"/>
<line class="ln ln-red" x1="544" y1="230" x2="532" y2="242"/>
<text class="ts c-red" x="554" y="241">root 로그인 거부</text>
<text class="ts c-green" x="268" y="226" text-anchor="middle">20022 허용 → 통과</text>
<text class="ts c-green" x="434" y="226" text-anchor="middle">20022 에서 받음</text>

<!-- 행 C: 운영자 -->
<rect class="box" x="24" y="270" width="150" height="52" rx="10"/>
<text class="tb" x="99" y="292" text-anchor="middle">운영자</text>
<text class="ts" x="99" y="312" text-anchor="middle">일반 계정으로 20022</text>
<line class="ln ln-blue" x1="174" y1="296" x2="690" y2="296" marker-end="url(#arrow-blue)"/>
<text class="ts c-green" x="268" y="286" text-anchor="middle">통과</text>
<text class="ts c-green" x="434" y="286" text-anchor="middle">통과</text>
<text class="ts c-green" x="600" y="286" text-anchor="middle">일반 계정 → 통과</text>

<!-- 오른쪽 끝: 정상 경로 -->
<rect class="green" x="694" y="272" width="162" height="48" rx="10"/>
<text class="tb c-green" x="775" y="301" text-anchor="middle">일반 계정 로그인</text>
<line class="ln ln-green" x1="775" y1="320" x2="775" y2="340" marker-end="url(#arrow-green)"/>
<rect class="green" x="694" y="344" width="162" height="44" rx="10"/>
<text class="tb c-green" x="775" y="371" text-anchor="middle">sudo (다시 인증)</text>
<line class="ln ln-purple" x1="775" y1="388" x2="775" y2="408" marker-end="url(#arrow-purple)"/>
<rect class="purple" x="694" y="412" width="162" height="52" rx="10"/>
<text class="mono c-purple" x="775" y="434" text-anchor="middle">/var/log/auth.log</text>
<text class="ts" x="775" y="454" text-anchor="middle">에 기록 (누가·언제)</text>

<!-- 아래 메모 -->
<text class="ts" x="24" y="364">포트 변경 = 소음 줄이기(은폐) · 방화벽·root 차단 = 실제 통제</text>
<text class="ts" x="24" y="388">남은 과제: 키 인증 + <tspan class="mono">PasswordAuthentication no</tspan></text>
<line class="ln ln-red dash" x1="24" y1="438" x2="64" y2="438"/>
<text class="ts" x="72" y="443">공격 (막힘)</text>
<line class="ln ln-blue" x1="160" y1="438" x2="200" y2="438"/>
<text class="ts" x="208" y="443">정상 접속</text>
<rect class="green" x="286" y="430" width="16" height="16" rx="4"/>
<text class="ts" x="310" y="443">성공</text>
<rect class="purple" x="358" y="430" width="16" height="16" rx="4"/>
<text class="ts" x="382" y="443">기록</text>

</svg>
