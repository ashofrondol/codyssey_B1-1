<svg xmlns="http://www.w3.org/2000/svg" width="880" height="504" viewBox="0 0 880 504" role="img" aria-labelledby="title desc">
<title id="title">살아 있음(프로세스)과 준비됨(LISTEN 소켓)은 다르다</title>
<desc id="desc">가운데는 실제로 띄운 agent-app 이다. PID 36053 부트로더(부모)가 PID 36054 파이썬 본체(자식)를 실행하고, 자식이 소켓 fd 4 로 0.0.0.0:15034 를 LISTEN 한다. 왼쪽 ① pgrep -x agent-app 은 부모·자식 두 PID 를 찾고 head -n1 이 부모 36053 을 골라 로그의 PID 로 쓴다. 오른쪽 ② ss -tlnH 와 awk 는 15034 가 LISTEN 중인지만 보고 [OK] 를 낸다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="504"/>
<text class="th" x="24" y="34">살아 있음(프로세스)과 준비됨(LISTEN 소켓)은 다르다</text>
<text class="ts" x="24" y="56">가운데 = 실제로 띄운 앱 (2026-09-23 실측) · 가는 화살표 = 검사가 들여다보는 대상</text>

<!-- 열 제목 -->
<text class="th" x="134" y="92" text-anchor="middle">① 살아 있나?</text>
<text class="ts" x="134" y="112" text-anchor="middle">프로세스 검사 · monitor.sh:39</text>
<text class="th" x="386" y="92" text-anchor="middle">실제 앱</text>
<text class="ts" x="386" y="112" text-anchor="middle">부모·자식 두 프로세스</text>
<text class="th" x="692" y="92" text-anchor="middle">② 받을 준비가 됐나?</text>
<text class="ts" x="692" y="112" text-anchor="middle">포트 검사 · monitor.sh:49</text>

<!-- 가운데: 실제 앱 -->
<rect class="box" x="276" y="124" width="220" height="68" rx="10"/>
<text class="tb" x="386" y="146" text-anchor="middle">agent-app · PID 36053</text>
<text class="ts" x="386" y="166" text-anchor="middle">PyInstaller 부트로더 (부모)</text>
<text class="ts" x="386" y="184" text-anchor="middle">NI 0 · RSS 2,244 KB</text>
<line class="ln" x1="386" y1="192" x2="386" y2="214" marker-end="url(#arrow)"/>
<text class="ts" x="396" y="209">자식 실행</text>

<rect class="blue" x="276" y="218" width="220" height="68" rx="10"/>
<text class="tb c-blue" x="386" y="240" text-anchor="middle">agent-app · PID 36054</text>
<text class="ts" x="386" y="260" text-anchor="middle">파이썬 본체 (자식)</text>
<text class="ts" x="386" y="278" text-anchor="middle">NI 10 · RSS 94,684 KB</text>
<line class="ln ln-purple" x1="386" y1="286" x2="386" y2="308" marker-end="url(#arrow-purple)"/>
<text class="ts" x="396" y="303">포트를 엶</text>

<rect class="purple" x="276" y="312" width="220" height="68" rx="10"/>
<text class="tb c-purple" x="386" y="334" text-anchor="middle">소켓 fd 4</text>
<text class="mono" x="386" y="354" text-anchor="middle">0.0.0.0:15034 LISTEN</text>
<text class="ts" x="386" y="372" text-anchor="middle">backlog 1 (대기열 1칸)</text>

<!-- 왼쪽: ① pgrep -->
<rect class="box" x="24" y="124" width="220" height="44" rx="10"/>
<text class="mono" x="134" y="151" text-anchor="middle">pgrep -x agent-app</text>
<line class="ln" x1="134" y1="168" x2="134" y2="186" marker-end="url(#arrow)"/>
<rect class="box" x="24" y="190" width="220" height="56" rx="10"/>
<text class="ts" x="40" y="213">출력 1줄째</text>
<text class="mono" x="176" y="213" text-anchor="middle">36053</text>
<text class="ts" x="40" y="235">출력 2줄째</text>
<text class="mono" x="176" y="235" text-anchor="middle">36054</text>
<path class="ln" d="M246,208 L258,208 L258,158 L270,158" marker-end="url(#arrow)"/>
<path class="ln" d="M246,230 L258,230 L258,252 L270,252" marker-end="url(#arrow)"/>
<line class="ln" x1="134" y1="246" x2="134" y2="264" marker-end="url(#arrow)"/>
<rect class="box" x="24" y="268" width="220" height="52" rx="10"/>
<text class="mono" x="134" y="290" text-anchor="middle">| head -n1</text>
<text class="ts" x="134" y="310" text-anchor="middle">첫 줄만 남김</text>
<line class="ln" x1="134" y1="320" x2="134" y2="338" marker-end="url(#arrow)"/>
<rect class="yellow" x="24" y="342" width="220" height="56" rx="10"/>
<text class="mono tb" x="134" y="365" text-anchor="middle">PID:36053</text>
<text class="ts" x="134" y="387" text-anchor="middle">로그에 남는 번호 = 부모</text>

<!-- 오른쪽: ② ss -->
<rect class="box" x="528" y="124" width="328" height="44" rx="10"/>
<text class="mono" x="692" y="151" text-anchor="middle">ss -tlnH</text>
<line class="ln" x1="692" y1="168" x2="692" y2="186" marker-end="url(#arrow)"/>
<rect class="box" x="528" y="190" width="328" height="56" rx="10"/>
<text class="mono" x="692" y="213" text-anchor="middle">LISTEN 0 1 <tspan class="c-purple tb">0.0.0.0:15034</tspan> 0.0.0.0:*</text>
<text class="ts" x="692" y="235" text-anchor="middle">4번째 칸 = 내 주소:포트</text>
<path class="ln ln-purple" d="M526,218 L512,218 L512,346 L500,346" marker-end="url(#arrow-purple)"/>
<line class="ln" x1="692" y1="246" x2="692" y2="264" marker-end="url(#arrow)"/>
<rect class="box" x="528" y="268" width="328" height="52" rx="10"/>
<text class="mono" x="692" y="290" text-anchor="middle">awk -v p=":15034" '$4 ~ p'</text>
<text class="ts" x="692" y="310" text-anchor="middle">4번째 칸에 :15034 가 있나?</text>
<line class="ln ln-green" x1="692" y1="320" x2="692" y2="338" marker-end="url(#arrow-green)"/>
<rect class="green" x="528" y="342" width="328" height="56" rx="10"/>
<text class="mono tb c-green" x="692" y="365" text-anchor="middle">Y → [OK]</text>
<text class="mono" x="692" y="387" text-anchor="middle">Checking port 15034... [OK]</text>

<!-- 아래: 커널 표, 한계 -->
<text class="ts" x="440" y="428" text-anchor="middle">커널 표 <tspan class="mono">/proc/net/tcp</tspan> 에서는 <tspan class="mono">00000000:3ABA … st 0A</tspan>  (3ABA = 15034, 0A = LISTEN)</text>
<rect class="orange" x="24" y="444" width="832" height="36" rx="10"/>
<text class="ts c-orange" x="440" y="467" text-anchor="middle">② 는 누가 열었는지 보지 않는다 — 남의 프로세스가 열어도, 127.0.0.1 에만 열려도 [OK]</text>

</svg>
